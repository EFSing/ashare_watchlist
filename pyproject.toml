[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-watchlist"
version = "0.1.0"
description = "A-share watchlist review and performance tracking utilities"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "plotly==5.24.1",
  "requests==2.32.3",
  "tabulate==0.9.0",
  "exchange-calendars==4.13.2",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
research = ["pyarrow==17.0.0"]
sector = ["akshare==1.18.94"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"
