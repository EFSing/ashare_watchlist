name: daily-t-close

on:
  schedule:
    # Primary: 17:17 BJT (09:17 UTC). The prior primary cron was 17 10 * * 1-5.
    - cron: "17 9 * * 1-5"
    # Bounded retry: 18:17 BJT (10:17 UTC). The prior retry cron was 17 11 * * 1-5.
    - cron: "17 10 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Cloud validation mode"
        required: true
        default: preflight-only
        type: choice
        options:
          - preflight-only
          - production
          - delivery-test
      as_of_date:
        description: "Explicit target date (required for external production dispatch)"
        required: false
        default: ""
        type: string
      trigger_source:
        description: "Dispatch source"
        required: false
        default: manual
        type: choice
        options:
          - manual
          - cloudflare-cron
          - external-scheduler
      allow_weekend_backfill:
        description: "Explicitly authorize the bounded 2026-09-18 weekend backfill"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ashare-daily-production
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'production' }}
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      ASHARE_DISABLE_DRIVE_CHECKPOINT: "1"
      ASHARE_EPHEMERAL_RULE_PERFORMANCE_RECONSTRUCTION: "1"
      ASHARE_SKIP_PRODUCTION: "0"
      BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
      BARK_SERVER_URL: ${{ secrets.BARK_SERVER_URL }}
      REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      EVENT_NAME: ${{ github.event_name }}
      SCHEDULE_CRON: ${{ github.event.schedule || '' }}
      DISPATCH_AS_OF_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.as_of_date || '' }}
      DISPATCH_TRIGGER_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger_source || 'manual' }}
      DISPATCH_ALLOW_WEEKEND_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_weekend_backfill || false }}
      PRODUCTION_CANONICAL_READY: "0"
      RUNTIME_STATE_PERSISTED: "NO"
      PRODUCTION_FAILURE_STAGE: "NOT_STARTED"
      AS_OF_DATE: ""
      STALE_SCHEDULE: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout source master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned runtime and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Configure ephemeral cloud data root
        shell: bash
        run: |
          set -euo pipefail
          data_root="$RUNNER_TEMP/ashare_data"
          echo "ASHARE_DATA_ROOT=$data_root" >> "$GITHUB_ENV"
          echo "ASHARE_EVIDENCE_ROOT=$data_root/t_close_evidence" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Resolve immutable cloud run context
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/run-context.json"
          set +e
          python scripts/cloud_runtime_state.py resolve-context \
            --event-name "$EVENT_NAME" \
            --schedule "$SCHEDULE_CRON" \
            --trigger-source "$DISPATCH_TRIGGER_SOURCE" \
            --as-of-date "$DISPATCH_AS_OF_DATE" \
            --mode "$RUN_MODE" \
            --now-utc "$(date -u --iso-8601=seconds)" > "$output"
          rc=$?
          set -e
          cat "$output"
          if (( rc != 0 )); then
            exit "$rc"
          fi
          status="$(python - "$output" <<'PY'
          import json
          import sys
          print(json.loads(open(sys.argv[1], encoding="utf-8").read())["status"])
          PY
          )"
          target_date="$(python - "$output" <<'PY'
          import json
          import sys
          print(json.loads(open(sys.argv[1], encoding="utf-8").read())["target_date"])
          PY
          )"
          if [[ "${DISPATCH_ALLOW_WEEKEND_BACKFILL,,}" == "true" ]]; then
            if [[ "$EVENT_NAME" != "workflow_dispatch" || "$RUN_MODE" != "production" || "$DISPATCH_TRIGGER_SOURCE" != "manual" || "$DISPATCH_AS_OF_DATE" != "2026-09-18" ]]; then
              echo "::error::Weekend backfill authorization is limited to manual production dispatch for as_of_date=2026-09-18 with trigger_source=manual"
              exit 1
            fi
          fi
          echo "RUN_CONTEXT_RESULT=$output" >> "$GITHUB_ENV"
          echo "RUN_CONTEXT_STATUS=$status" >> "$GITHUB_ENV"
          echo "AS_OF_DATE=$target_date" >> "$GITHUB_ENV"
          if [[ "$status" == "SKIPPED_STALE_SCHEDULE" ]]; then
            echo "STALE_SCHEDULE=1" >> "$GITHUB_ENV"
            echo "ASHARE_SKIP_PRODUCTION=1" >> "$GITHUB_ENV"
            echo "ASHARE_SUMMARY_RESULT=$output" >> "$GITHUB_ENV"
            echo "ASHARE_SUMMARY_STATUS=SKIPPED_STALE_SCHEDULE" >> "$GITHUB_ENV"
          fi

      - name: Checkout runtime-state separately
        uses: actions/checkout@v4
        with:
          ref: runtime-state
          path: runtime-state
          fetch-depth: 1
          persist-credentials: true

      - name: Restore and validate durable runtime state
        if: env.STALE_SCHEDULE != '1'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cloud_runtime_state.py restore \
            --state-root "$GITHUB_WORKSPACE/runtime-state" \
            --data-root "$ASHARE_DATA_ROOT"
          python scripts/cloud_runtime_state.py validate \
            --state-root "$GITHUB_WORKSPACE/runtime-state" \
            --data-root "$ASHARE_DATA_ROOT"
          test "$(git -C runtime-state rev-parse --abbrev-ref HEAD)" = "runtime-state"

      - name: Check same-day completion before provider calls
        if: env.RUN_MODE == 'production' && env.ASHARE_SKIP_PRODUCTION != '1'
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/completed.json"
          python scripts/cloud_runtime_state.py check-completed \
            --data-root "$ASHARE_DATA_ROOT" \
            --date "$AS_OF_DATE" > "$output"
          status="$(python - "$output" <<'PY'
          import json
          import sys
          print(json.loads(open(sys.argv[1], encoding="utf-8").read())["status"])
          PY
          )"
          if [[ "$status" == "ALREADY_COMPLETED" ]]; then
            echo "ASHARE_SKIP_PRODUCTION=1" >> "$GITHUB_ENV"
            echo "ASHARE_SUMMARY_RESULT=$output" >> "$GITHUB_ENV"
            echo "ASHARE_SUMMARY_STATUS=ALREADY_COMPLETED" >> "$GITHUB_ENV"
            echo "PRODUCTION_CANONICAL_READY=1" >> "$GITHUB_ENV"
            echo "RUNTIME_STATE_PERSISTED=YES" >> "$GITHUB_ENV"
            echo "RUNTIME_STATE_SHA=$(git -C runtime-state rev-parse HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Cloud preflight before any provider production call
        if: env.RUN_MODE != 'delivery-test' && env.ASHARE_SKIP_PRODUCTION != '1'
        shell: bash
        run: |
          set -euo pipefail
          echo "PRODUCTION_FAILURE_STAGE=cloud-preflight" >> "$GITHUB_ENV"
          output="$RUNNER_TEMP/preflight.json"
          backfill_args=()
          if [[ "${DISPATCH_ALLOW_WEEKEND_BACKFILL,,}" == "true" ]]; then
            backfill_args+=(--allow-weekend-backfill)
          fi
          set +e
          python scripts/t_close_runner.py --preflight \
            --as-of-date "$AS_OF_DATE" \
            --data-root "$ASHARE_DATA_ROOT" \
            --evidence-root "$ASHARE_EVIDENCE_ROOT" \
            "${backfill_args[@]}" > "$output"
          rc=$?
          set -e
          echo "PREFLIGHT_RESULT=$output" >> "$GITHUB_ENV"
          status="$(python - "$output" <<'PY'
          import json
          import sys
          lines = open(sys.argv[1], encoding="utf-8").read().strip().splitlines()
          print(json.loads(lines[-1])["status"] if lines else "PREFLIGHT_OUTPUT_MISSING")
          PY
          )"
          credential="$(python - "$output" <<'PY'
          import json
          import sys
          lines = open(sys.argv[1], encoding="utf-8").read().strip().splitlines()
          print(json.loads(lines[-1]).get("credential_context", "UNKNOWN") if lines else "UNKNOWN")
          PY
          )"
          packages="$(python - "$output" <<'PY'
          import json
          import sys
          lines = open(sys.argv[1], encoding="utf-8").read().strip().splitlines()
          print(json.loads(lines[-1]).get("runtime_packages", "UNKNOWN") if lines else "UNKNOWN")
          PY
          )"
          echo "PREFLIGHT_STATUS=$status" >> "$GITHUB_ENV"
          if [[ "$ASHARE_SKIP_PRODUCTION" == "1" ]]; then
            exit 0
          fi
          if (( rc != 0 )); then
            cat "$output"
            exit "$rc"
          fi
          if [[ "$RUN_MODE" == "preflight-only" ]]; then
            if [[ "$credential" != "READY" || "$packages" != "READY" ]]; then
              cat "$output"
              exit 1
            fi
            echo "ASHARE_SKIP_PRODUCTION=1" >> "$GITHUB_ENV"
            echo "ASHARE_SUMMARY_RESULT=$output" >> "$GITHUB_ENV"
            echo "ASHARE_SUMMARY_STATUS=$status" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ "$status" == "SKIPPED_NON_TRADING_DAY" ]]; then
            echo "ASHARE_SKIP_PRODUCTION=1" >> "$GITHUB_ENV"
            echo "ASHARE_SUMMARY_RESULT=$output" >> "$GITHUB_ENV"
            echo "ASHARE_SUMMARY_STATUS=$status" >> "$GITHUB_ENV"
            exit 0
          fi
          preflight_ready=0
          if [[ "$status" == "POST_CLOSE_DIAGNOSTIC_READY" ]]; then
            preflight_ready=1
          elif [[ "$status" == "AUTHORIZED_WEEKEND_BACKFILL_READY" ]]; then
            if [[ "$EVENT_NAME" == "workflow_dispatch" && "$RUN_MODE" == "production" && "$DISPATCH_TRIGGER_SOURCE" == "manual" && "$DISPATCH_AS_OF_DATE" == "2026-09-18" && "${DISPATCH_ALLOW_WEEKEND_BACKFILL,,}" == "true" ]]; then
              preflight_ready=1
            fi
          fi
          if (( preflight_ready != 1 )) || [[ "$credential" != "READY" || "$packages" != "READY" ]]; then
            cat "$output"
            exit 1
          fi

      - name: Publish non-production preflight or skip summary
        if: env.RUN_MODE != 'delivery-test' && env.ASHARE_SKIP_PRODUCTION == '1' && env.ASHARE_SUMMARY_STATUS != 'ALREADY_COMPLETED'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cloud_runtime_state.py summary \
            --data-root "$ASHARE_DATA_ROOT" \
            --date "$AS_OF_DATE" \
            --status "$ASHARE_SUMMARY_STATUS" \
            --state-commit "$(git -C runtime-state rev-parse HEAD)" \
            --result-file "$ASHARE_SUMMARY_RESULT" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish already-completed summary
        if: env.RUN_MODE != 'delivery-test' && env.ASHARE_SKIP_PRODUCTION == '1' && env.ASHARE_SUMMARY_STATUS == 'ALREADY_COMPLETED'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cloud_runtime_state.py summary \
            --data-root "$ASHARE_DATA_ROOT" \
            --date "$AS_OF_DATE" \
            --status "$ASHARE_SUMMARY_STATUS" \
            --state-commit "$(git -C runtime-state rev-parse HEAD)" \
            --result-file "$ASHARE_SUMMARY_RESULT" >> "$GITHUB_STEP_SUMMARY"

      - name: Run genuine XSHG T-close production chain
        if: env.RUN_MODE == 'production' && env.ASHARE_SKIP_PRODUCTION != '1'
        shell: bash
        run: |
          set -euo pipefail
          echo "PRODUCTION_FAILURE_STAGE=production" >> "$GITHUB_ENV"
          output="$RUNNER_TEMP/production.json"
          backfill_args=()
          if [[ "${DISPATCH_ALLOW_WEEKEND_BACKFILL,,}" == "true" ]]; then
            backfill_args+=(--allow-weekend-backfill)
          fi
          set +e
          python scripts/t_close_runner.py \
            --as-of-date "$AS_OF_DATE" \
            --data-root "$ASHARE_DATA_ROOT" \
            --evidence-root "$ASHARE_EVIDENCE_ROOT" \
            "${backfill_args[@]}" > "$output"
          rc=$?
          set -e
          echo "PRODUCTION_RESULT=$output" >> "$GITHUB_ENV"
          status="$(python - "$output" <<'PY'
          import json
          import sys
          lines = open(sys.argv[1], encoding="utf-8").read().strip().splitlines()
          print(json.loads(lines[-1]).get("status", "PRODUCTION_OUTPUT_MISSING") if lines else "PRODUCTION_OUTPUT_MISSING")
          PY
          )"
          if [[ "$status" == "NO_VALID_INPUT" ]]; then
            echo "ASHARE_SUMMARY_RESULT=$output" >> "$GITHUB_ENV"
            echo "ASHARE_SUMMARY_STATUS=NO_VALID_INPUT" >> "$GITHUB_ENV"
            echo "NO_VALID_INPUT_REPORT_READY=1" >> "$GITHUB_ENV"
            cat "$output"
            if (( rc == 0 )); then
              exit 1
            fi
            exit "$rc"
          fi
          if (( rc != 0 )); then
            cat "$output"
            exit "$rc"
          fi
          python - "$output" <<'PY'
          import json
          import sys

          lines = open(sys.argv[1], encoding="utf-8").read().strip().splitlines()
          result = json.loads(lines[-1]) if lines else {}
          bundle = result.get("daily_close_bundle") or {}
          tracker = bundle.get("track_perf") or {}
          renderer = bundle.get("renderer") or {}
          checkpoint = bundle.get("cloud_checkpoint") or {}
          if result.get("status") != "T_CLOSE_EVIDENCE_PACKAGE_AND_WATCHLIST_PERSISTED":
              raise SystemExit(f"production status is not successful: {result.get('status')}")
          if tracker.get("status") != "SUCCESS":
              raise SystemExit(f"tracker failed: {tracker.get('status')}")
          if renderer.get("status") != "SUCCESS":
              raise SystemExit(f"renderer failed: {renderer.get('status')}")
          if checkpoint.get("status") != "DRIVE_CHECKPOINT_DISABLED_FOR_CLOUD":
              raise SystemExit(f"unexpected cloud checkpoint status: {checkpoint.get('status')}")
          if bundle.get("status") in {"REPORT_FAILED", "REVIEW_FAILED_REPORT_READY"}:
              raise SystemExit(f"daily report bundle failed: {bundle.get('status')}")
          print("production canonical chain verified")
          PY

      - name: Validate production outputs before state copy
        if: env.RUN_MODE == 'production' && env.ASHARE_SKIP_PRODUCTION != '1'
        shell: bash
        run: |
          set -euo pipefail
          echo "PRODUCTION_FAILURE_STAGE=canonical-output-validation" >> "$GITHUB_ENV"
          python scripts/cloud_runtime_state.py validate --data-root "$ASHARE_DATA_ROOT"
          python scripts/cloud_runtime_state.py check-completed \
            --data-root "$ASHARE_DATA_ROOT" \
            --date "$AS_OF_DATE" | tee "$RUNNER_TEMP/validated-completion.json"
          python - "$RUNNER_TEMP/validated-completion.json" <<'PY'
          import json
          import sys
          value = json.loads(open(sys.argv[1], encoding="utf-8").read())
          if value.get("status") != "ALREADY_COMPLETED":
              raise SystemExit(f"production output checkpoint is incomplete: {value}")
          PY

      - name: Copy allowlisted durable outputs into runtime-state checkout
        if: env.RUN_MODE == 'production' && env.ASHARE_SKIP_PRODUCTION != '1'
        shell: bash
        run: |
          set -euo pipefail
          echo "PRODUCTION_FAILURE_STAGE=runtime-state-persist" >> "$GITHUB_ENV"
          python scripts/cloud_runtime_state.py persist \
            --state-root "$GITHUB_WORKSPACE/runtime-state" \
            --data-root "$ASHARE_DATA_ROOT"

      - name: Atomically commit and push runtime-state with GITHUB_TOKEN
        if: env.RUN_MODE == 'production' && env.ASHARE_SKIP_PRODUCTION != '1'
        shell: bash
        run: |
          set -euo pipefail
          echo "PRODUCTION_FAILURE_STAGE=runtime-state-push" >> "$GITHUB_ENV"
          mapfile -t stage_paths < <(python scripts/cloud_runtime_state.py list --state-root "$GITHUB_WORKSPACE/runtime-state" --paths-only)
          (cd runtime-state && git add -- "${stage_paths[@]}")
          # Canonical generated artifacts have already passed validation; preserve their exact bytes.
          unexpected="$(git -C runtime-state diff --cached --name-only | python -c 'import sys; staged={line.strip() for line in sys.stdin if line.strip()}; allowed=set(sys.argv[1:]); print("\n".join(sorted(staged - allowed)))' "${stage_paths[@]}")"
          if [[ -n "$unexpected" ]]; then
            echo "unexpected staged runtime-state paths: $unexpected"
            exit 1
          fi
          if git -C runtime-state diff --cached --quiet; then
            state_sha="$(git -C runtime-state rev-parse HEAD)"
          else
            git -C runtime-state config user.name "github-actions[bot]"
            git -C runtime-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C runtime-state commit -m "runtime: persist daily state $AS_OF_DATE"
            git -C runtime-state push origin HEAD:runtime-state
            state_sha="$(git -C runtime-state rev-parse HEAD)"
          fi
          echo "RUNTIME_STATE_SHA=$state_sha" >> "$GITHUB_ENV"
          echo "PRODUCTION_CANONICAL_READY=1" >> "$GITHUB_ENV"
          echo "RUNTIME_STATE_PERSISTED=YES" >> "$GITHUB_ENV"

      - name: Validate delivery secrets for delivery-test
        if: env.RUN_MODE == 'delivery-test'
        shell: bash
        run: |
          set +e
          output="$RUNNER_TEMP/delivery-secrets.json"
          python scripts/daily_report_delivery.py validate-secrets > "$output"
          rc=$?
          set -e
          echo "DELIVERY_TEST_SECRETS_RESULT=$output" >> "$GITHUB_ENV"
          cat "$output"
          if (( rc != 0 )); then
            exit "$rc"
          fi

      - name: Send delivery-test Email and Bark
        if: env.RUN_MODE == 'delivery-test'
        shell: bash
        run: |
          set +e
          output="$RUNNER_TEMP/delivery-test.json"
          python scripts/daily_report_delivery.py delivery-test \
            --date "$AS_OF_DATE" \
            --data-root "$ASHARE_DATA_ROOT" \
            --run-url "$ACTIONS_RUN_URL" > "$output"
          rc=$?
          set -e
          echo "DELIVERY_TEST_RESULT=$output" >> "$GITHUB_ENV"
          cat "$output"
          if (( rc != 0 )); then
            exit "$rc"
          fi

      - name: Publish delivery-test summary
        if: always() && env.RUN_MODE == 'delivery-test'
        shell: bash
        run: |
          set -euo pipefail
          echo "## Delivery test" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${DELIVERY_TEST_RESULT:-}" && -f "$DELIVERY_TEST_RESULT" ]]; then
            cat "$DELIVERY_TEST_RESULT" >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "${DELIVERY_TEST_SECRETS_RESULT:-}" && -f "$DELIVERY_TEST_SECRETS_RESULT" ]]; then
            cat "$DELIVERY_TEST_SECRETS_RESULT" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "market-data provider calls = 0" >> "$GITHUB_STEP_SUMMARY"
          echo "runtime-state mutation = NO" >> "$GITHUB_STEP_SUMMARY"

      - name: Deliver production report by Email and Bark
        if: always() && env.RUN_MODE == 'production' && env.PRODUCTION_CANONICAL_READY == '1'
        shell: bash
        run: |
          set +e
          output="$RUNNER_TEMP/delivery.json"
          result_file="${PRODUCTION_RESULT:-${ASHARE_SUMMARY_RESULT:-}}"
          result_args=()
          if [[ -n "$result_file" && -f "$result_file" ]]; then
            result_args+=(--result-file "$result_file")
          fi
          python scripts/daily_report_delivery.py deliver \
            --mode production \
            --date "$AS_OF_DATE" \
            --data-root "$ASHARE_DATA_ROOT" \
            --runtime-state-persisted "$RUNTIME_STATE_PERSISTED" \
            --run-url "$ACTIONS_RUN_URL" \
            "${result_args[@]}" > "$output"
          rc=$?
          set -e
          echo "DELIVERY_RESULT=$output" >> "$GITHUB_ENV"
          cat "$output"
          if (( rc != 0 )); then
            exit "$rc"
          fi

      - name: Persist delivery receipt to runtime-state
        if: always() && env.RUN_MODE == 'production' && env.PRODUCTION_CANONICAL_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          echo "PRODUCTION_FAILURE_STAGE=delivery-receipt-persist" >> "$GITHUB_ENV"
          python scripts/cloud_runtime_state.py persist \
            --state-root "$GITHUB_WORKSPACE/runtime-state" \
            --data-root "$ASHARE_DATA_ROOT"
          mapfile -t stage_paths < <(python scripts/cloud_runtime_state.py list --state-root "$GITHUB_WORKSPACE/runtime-state" --paths-only)
          (cd runtime-state && git add -- "${stage_paths[@]}")
          git -C runtime-state diff --cached --check
          unexpected="$(git -C runtime-state diff --cached --name-only | python -c 'import sys; staged={line.strip() for line in sys.stdin if line.strip()}; allowed=set(sys.argv[1:]); print("\n".join(sorted(staged - allowed)))' "${stage_paths[@]}")"
          if [[ -n "$unexpected" ]]; then
            echo "unexpected staged runtime-state paths: $unexpected"
            exit 1
          fi
          if git -C runtime-state diff --cached --quiet; then
            state_sha="$(git -C runtime-state rev-parse HEAD)"
          else
            git -C runtime-state config user.name "github-actions[bot]"
            git -C runtime-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C runtime-state commit -m "runtime: persist delivery receipt $AS_OF_DATE"
            git -C runtime-state push origin HEAD:runtime-state
            state_sha="$(git -C runtime-state rev-parse HEAD)"
          fi
          echo "RUNTIME_STATE_SHA=$state_sha" >> "$GITHUB_ENV"

      - name: Write production delivery Actions summary
        if: always() && env.RUN_MODE == 'production' && env.PRODUCTION_CANONICAL_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          result_file="${PRODUCTION_RESULT:-${ASHARE_SUMMARY_RESULT:-}}"
          result_args=()
          if [[ -n "$result_file" && -f "$result_file" ]]; then
            result_args+=(--result-file "$result_file")
          fi
          state_commit="${RUNTIME_STATE_SHA:-$(git -C runtime-state rev-parse HEAD)}"
          python scripts/cloud_runtime_state.py summary \
            --data-root "$ASHARE_DATA_ROOT" \
            --date "$AS_OF_DATE" \
            --status "${ASHARE_SUMMARY_STATUS:-SUCCESS}" \
            --state-commit "$state_commit" \
            "${result_args[@]}" >> "$GITHUB_STEP_SUMMARY"
          delivery_args=()
          if [[ -n "${DELIVERY_RESULT:-}" && -f "$DELIVERY_RESULT" ]]; then
            delivery_args+=(--result-file "$DELIVERY_RESULT")
          fi
          python scripts/daily_report_delivery.py summary \
            --data-root "$ASHARE_DATA_ROOT" \
            --date "$AS_OF_DATE" \
            --production-status "${ASHARE_SUMMARY_STATUS:-SUCCESS}" \
            --runtime-state-persisted "$RUNTIME_STATE_PERSISTED" \
            "${delivery_args[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce production delivery health
        if: always() && env.RUN_MODE == 'production' && env.PRODUCTION_CANONICAL_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DELIVERY_RESULT:-}" || ! -f "$DELIVERY_RESULT" ]]; then
            echo "delivery result is missing"
            exit 1
          fi
          status="$(python - "$DELIVERY_RESULT" <<'PY'
          import json
          import sys
          lines = open(sys.argv[1], encoding="utf-8").read().strip().splitlines()
          print(json.loads(lines[-1]).get("status", "DELIVERY_RESULT_MISSING") if lines else "DELIVERY_RESULT_MISSING")
          PY
          )"
          case "$status" in
            DELIVERY_SUCCESS|ALREADY_DELIVERED)
              echo "delivery health: $status"
              ;;
            *)
              echo "delivery health: $status"
              exit 1
              ;;
          esac

      - name: Checkout clean runtime-state for failure notice
        if: always() && env.RUN_MODE == 'production' && env.AS_OF_DATE != '' && env.ASHARE_SKIP_PRODUCTION != '1' && env.PRODUCTION_CANONICAL_READY != '1'
        uses: actions/checkout@v4
        with:
          ref: runtime-state
          path: failure-runtime-state
          fetch-depth: 1
          persist-credentials: true

      - name: Send production failure notification
        if: always() && env.RUN_MODE == 'production' && env.AS_OF_DATE != '' && env.ASHARE_SKIP_PRODUCTION != '1' && env.PRODUCTION_CANONICAL_READY != '1'
        shell: bash
        run: |
          set +e
          output="$RUNNER_TEMP/failure-delivery.json"
          result_file="${PRODUCTION_RESULT:-${PREFLIGHT_RESULT:-}}"
          result_args=()
          if [[ -n "$result_file" && -f "$result_file" ]]; then
            result_args+=(--result-file "$result_file")
          fi
          python scripts/daily_report_delivery.py failure \
            --date "$AS_OF_DATE" \
            --data-root "$ASHARE_DATA_ROOT" \
            --failure-stage "${PRODUCTION_FAILURE_STAGE:-production}" \
            --error-summary "PRODUCTION_RUNTIME_FAILURE" \
            --run-url "$ACTIONS_RUN_URL" \
            --production-status "${ASHARE_SUMMARY_STATUS:-}" \
            "${result_args[@]}" > "$output"
          rc=$?
          set -e
          echo "FAILURE_DELIVERY_RESULT=$output" >> "$GITHUB_ENV"
          cat "$output"
          if (( rc != 0 )); then
            echo "failure notification command could not complete: $rc"
          fi

      - name: Persist operational failure notice in clean runtime-state checkout
        if: always() && env.RUN_MODE == 'production' && env.AS_OF_DATE != '' && env.ASHARE_SKIP_PRODUCTION != '1' && env.PRODUCTION_CANONICAL_READY != '1'
        shell: bash
        run: |
          set +e
          output="$RUNNER_TEMP/failure-notice-state.json"
          python scripts/cloud_runtime_state.py persist-failure-notice \
            --state-root "$GITHUB_WORKSPACE/failure-runtime-state" \
            --data-root "$ASHARE_DATA_ROOT" \
            --date "$AS_OF_DATE" > "$output"
          rc=$?
          cat "$output"
          if (( rc != 0 )); then
            echo "FAILURE_NOTICE_STATE_PERSISTED=NO" >> "$GITHUB_ENV"
            echo "failure notice was not safely persisted"
            exit 0
          fi
          notice_path="data/delivery/daily_failure_notice_${AS_OF_DATE//-/}.json"
          git -C failure-runtime-state add -- "$notice_path"
          staged="$(git -C failure-runtime-state diff --cached --name-only)"
          if [[ "$staged" != "$notice_path" ]]; then
            echo "unexpected staged failure-notice paths: $staged"
            echo "FAILURE_NOTICE_STATE_PERSISTED=NO" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! git -C failure-runtime-state diff --cached --check; then
            echo "failure notice has staged whitespace errors"
            echo "FAILURE_NOTICE_STATE_PERSISTED=NO" >> "$GITHUB_ENV"
            exit 0
          fi
          if git -C failure-runtime-state diff --cached --quiet; then
            state_sha="$(git -C failure-runtime-state rev-parse HEAD)"
          else
            git -C failure-runtime-state config user.name "github-actions[bot]"
            git -C failure-runtime-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git -C failure-runtime-state commit -m "runtime: persist daily failure notice $AS_OF_DATE"; then
              echo "FAILURE_NOTICE_STATE_PERSISTED=NO" >> "$GITHUB_ENV"
              echo "failure notice commit failed; dedupe is not claimed"
              exit 0
            fi
            if ! git -C failure-runtime-state push origin HEAD:runtime-state; then
              echo "FAILURE_NOTICE_STATE_PERSISTED=NO" >> "$GITHUB_ENV"
              echo "failure notice push failed; dedupe is not claimed"
              exit 0
            fi
            state_sha="$(git -C failure-runtime-state rev-parse HEAD)"
          fi
          echo "FAILURE_NOTICE_STATE_PERSISTED=YES" >> "$GITHUB_ENV"
          echo "FAILURE_NOTICE_RUNTIME_STATE_SHA=$state_sha" >> "$GITHUB_ENV"

      - name: Persist NO_VALID_INPUT diagnostic artifacts in clean runtime-state checkout
        if: always() && env.RUN_MODE == 'production' && env.AS_OF_DATE != '' && env.ASHARE_SKIP_PRODUCTION != '1' && env.PRODUCTION_CANONICAL_READY != '1' && env.NO_VALID_INPUT_REPORT_READY == '1'
        shell: bash
        run: |
          set +e
          output="$RUNNER_TEMP/input-diagnostic-state.json"
          python scripts/cloud_runtime_state.py persist-input-diagnostic \
            --state-root "$GITHUB_WORKSPACE/failure-runtime-state" \
            --data-root "$ASHARE_DATA_ROOT" \
            --date "$AS_OF_DATE" > "$output"
          rc=$?
          cat "$output"
          if (( rc != 0 )); then
            echo "INPUT_DIAGNOSTIC_STATE_PERSISTED=NO" >> "$GITHUB_ENV"
            echo "input diagnostic was not safely persisted"
            exit 0
          fi
          diagnostic_path="data/diagnostics/daily_input_diagnostic_${AS_OF_DATE//-/}.json"
          report_path="data/reports/daily_close_${AS_OF_DATE//-/}.html"
          git -C failure-runtime-state add -- "$diagnostic_path" "$report_path"
          staged="$(git -C failure-runtime-state diff --cached --name-only)"
          expected="${diagnostic_path}"$'\n'"${report_path}"
          if [[ "$staged" != "$expected" && "$staged" != "${report_path}"$'\n'"${diagnostic_path}" ]]; then
            echo "unexpected staged input-diagnostic paths: $staged"
            echo "INPUT_DIAGNOSTIC_STATE_PERSISTED=NO" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! git -C failure-runtime-state diff --cached --check; then
            echo "input diagnostic has staged whitespace errors"
            echo "INPUT_DIAGNOSTIC_STATE_PERSISTED=NO" >> "$GITHUB_ENV"
            exit 0
          fi
          if git -C failure-runtime-state diff --cached --quiet; then
            state_sha="$(git -C failure-runtime-state rev-parse HEAD)"
          else
            git -C failure-runtime-state config user.name "github-actions[bot]"
            git -C failure-runtime-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git -C failure-runtime-state commit -m "runtime: persist NO_VALID_INPUT diagnostic $AS_OF_DATE"; then
              echo "INPUT_DIAGNOSTIC_STATE_PERSISTED=NO" >> "$GITHUB_ENV"
              exit 0
            fi
            if ! git -C failure-runtime-state push origin HEAD:runtime-state; then
              echo "INPUT_DIAGNOSTIC_STATE_PERSISTED=NO" >> "$GITHUB_ENV"
              echo "input diagnostic push failed"
              exit 0
            fi
            state_sha="$(git -C failure-runtime-state rev-parse HEAD)"
          fi
          echo "INPUT_DIAGNOSTIC_STATE_PERSISTED=YES" >> "$GITHUB_ENV"
          echo "INPUT_DIAGNOSTIC_RUNTIME_STATE_SHA=$state_sha" >> "$GITHUB_ENV"

      - name: Write production failure delivery summary
        if: always() && env.RUN_MODE == 'production' && env.AS_OF_DATE != '' && env.ASHARE_SKIP_PRODUCTION != '1' && env.PRODUCTION_CANONICAL_READY != '1'
        shell: bash
        run: |
          set -euo pipefail
          echo "## Production failure notification" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${FAILURE_DELIVERY_RESULT:-}" && -f "$FAILURE_DELIVERY_RESULT" ]]; then
            cat "$FAILURE_DELIVERY_RESULT" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "failure notice runtime-state persisted = ${FAILURE_NOTICE_STATE_PERSISTED:-NO}" >> "$GITHUB_STEP_SUMMARY"
          echo "input diagnostic runtime-state persisted = ${INPUT_DIAGNOSTIC_STATE_PERSISTED:-NO}" >> "$GITHUB_STEP_SUMMARY"
          result_file="${PRODUCTION_RESULT:-${PREFLIGHT_RESULT:-}}"
          result_args=()
          if [[ -n "$result_file" && -f "$result_file" ]]; then
            result_args+=(--result-file "$result_file")
          fi
          python scripts/cloud_runtime_state.py summary \
            --data-root "$ASHARE_DATA_ROOT" \
            --date "$AS_OF_DATE" \
            --status "${ASHARE_SUMMARY_STATUS:-FAILED}" \
            --state-commit "$(git -C failure-runtime-state rev-parse HEAD)" \
            "${result_args[@]}" >> "$GITHUB_STEP_SUMMARY"
