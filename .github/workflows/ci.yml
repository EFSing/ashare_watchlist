name: correctness

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned runtime and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run regression tests
        run: python -m pytest -q
      - name: Compile/check
        run: python -m compileall -q scripts tests
      - name: Test Cloudflare dispatcher
        run: node --test infra/cloudflare-tclose-dispatcher/test/dispatcher.test.js
