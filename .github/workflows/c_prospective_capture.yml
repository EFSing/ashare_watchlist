name: C prospective capture (disabled by default)

on:
  workflow_dispatch:
    inputs:
      target_date:
        required: true
      b_input_sha256:
        required: true

permissions:
  contents: read

concurrency:
  group: c-prospective-capture
  cancel-in-progress: false

jobs:
  capture:
    if: ${{ vars.C_SHARED_INPUT_HANDOFF_VERIFIED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.C_CAPTURE_STATE_REPOSITORY }}
          token: ${{ secrets.C_CAPTURE_STATE_TOKEN }}
          path: .c-state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install C reader runtime
        run: python -m pip install -e .
      - name: Restore private C capture state
        run: python scripts/c_state_store.py restore --state-repo .c-state
      - name: Consume frozen B input after independent handoff
        id: capture
        run: |
          python scripts/run_c_prospective_capture.py \
            --target-date "${{ inputs.target_date }}" \
            --b-input-package "$RUNNER_TEMP/b-input/package.json" \
            --b-input-sha256 "${{ inputs.b_input_sha256 }}"
      - name: Persist private C capture state
        if: ${{ always() && steps.capture.outcome != 'skipped' }}
        run: python scripts/c_state_store.py publish --state-repo .c-state
      - name: Commit private C capture state
        if: ${{ always() && steps.capture.outcome != 'skipped' }}
        run: |
          git -C .c-state config user.name "github-actions[bot]"
          git -C .c-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .c-state add data/research/c_prospective_capture_v1
          if git -C .c-state diff --cached --quiet; then
            echo "C state already current"
          else
            git -C .c-state commit -m "Persist C prospective capture"
            git -C .c-state push
          fi
